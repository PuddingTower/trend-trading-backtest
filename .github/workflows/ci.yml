name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 夹具不入版本库（避免再分发上游行情），所以 CI 里单测会自动 skip
      # 依赖真实数据的那几条 —— 这是有意的：CI 只保证纯逻辑不回退。
      - name: Run unit tests
        run: node tests/run.js

      - name: Verify skip-on-missing-fixtures contract
        run: |
          out=$(node tests/run.js 2>&1)
          echo "$out" | tail -3
          if echo "$out" | grep -q " 0 failed"; then
            echo "tests OK"
          else
            echo "::error::unit tests failed"; exit 1
          fi

  # 服务器不依赖任何第三方包，起得来 + 代理有响应就算通过
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Boot server and probe endpoints
        run: |
          python run_local_server.py > /tmp/server.log 2>&1 &
          sleep 3
          curl -fsS http://localhost:8080/api/health | head -c 200
          curl -fsS http://localhost:8080/ -o /dev/null
          # ES module 必须带正确 MIME，否则浏览器拒绝执行
          test "$(curl -fsSI http://localhost:8080/src/core/backtestEngine.js | grep -i '^content-type' | tr -d '\r' | grep -c 'text/javascript')" = 1
          echo "JS MIME OK"
          # 这一条断言的是**代理层的契约**，不是东方财富今天的可用性。
          # 上游对数据中心出口 IP 时通时断（本机实测：同一请求一会儿 200、一会儿 connection reset，
          # 且失败时是 502 而不是空响应），拿它当硬门只会让 CI 长期红 ——
          # 一个永远红的 CI 等于没有 CI，真实失败反而没人看。
          curl -sS "http://localhost:8080/api/kline?secid=113.rbm&count=3" -o /tmp/k.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/k.json'))
          assert isinstance(d, dict) and 'ok' in d, ('代理必须回 JSON 且带 ok 字段', d)
          if d['ok']:
              assert d.get('count', 0) > 0 and d.get('bars'), ('说 ok 就得真给数据', d)
              print('kline proxy OK,', d['count'], 'bars')
          else:
              assert d.get('error'), ('上游失败时必须把原因带出来，不能静默 ok:false', d)
              print('::warning title=行情上游不可达::东方财富 kline 此刻取不到（代理层已如实报错）:', d['error'])
          PY
